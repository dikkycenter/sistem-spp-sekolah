version: "3.8"

networks:
  spp_network:
    driver: bridge

services:
  9router:
    image: 9router/api:latest # Sesuaikan dengan image resmi/lokal 9Router yang kamu gunakan
    container_name: 9router
    environment:
      - PORT=20128
      # Masukkan env tambahan bawaan 9Router kamu di sini (misal: API_KEY, BASE_URL model, dll)
    ports:
      - "20128:20128"
    networks:
      - spp_network
    restart: unless-stopped

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_automation
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Jakarta
      - METRICS_ENABLED=false
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks:
      - spp_network
    depends_on:
      - 9router
    restart: unless-stopped
