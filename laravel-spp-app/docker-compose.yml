services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spp_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    depends_on:
      - postgres
      - redis
    networks:
      - spp_network
    environment:
      - PHP_IDE_CONFIG=serverName=spp-app

  nginx:
    image: nginx:1.27-alpine
    container_name: spp_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - spp_network

  postgres:
    image: postgres:16-alpine
    container_name: spp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-spp_db}
      POSTGRES_USER: ${DB_USERNAME:-spp_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - spp_network

  redis:
    image: redis:7-alpine
    container_name: spp_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - spp_network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spp_scheduler
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - postgres
      - redis
    networks:
      - spp_network
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spp_queue
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - spp_network
    command: php artisan queue:work redis --tries=3 --sleep=3 --timeout=90

  node:
    image: node:24-alpine
    container_name: spp_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data:
  redis_data:

networks:
  spp_network:
    driver: bridge
